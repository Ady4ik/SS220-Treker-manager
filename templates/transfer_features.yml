name: Перенести идею из SS14-Трекер
description: Если готовы перенести идею из трекера на борду гитхаба
title: "[F]: ЗаголовкИдеиПисатьЗаместоЭтогоСлова"
labels: ["Features"]
projects: ["SerbiaStrong-220/30"]
body:
  - type: markdown
    id: markdown_with_multiline_content
    attributes:
      value: |
        ## Приветствую!
        ### Удостоверься, что ты переносишь ИДЕЮ, а не баг

        Убедись, что идея содержит малую дозу алькогольного содержания на момент переноса.
        Если идея всё ещё сырая, сначала - обработай идею до конца в рамках трекера.

        ## Начнём!
    validations:
      required: false
  - type: textarea
    attributes:
      label: Ссылка на Discord трекер
      placeholder: "Сюда его можно просто вставить: Ctrl+V"
    validations:
      required: true
  - type: dropdown
    id: value
    attributes:
      label: Объём задачи
      description: Объём задачи мы определяем по тому, на сколько сильно задача влияет на геймплейную составляющую. Если идея о том, чтобы добавить новое блюдо в рецепты повара - это малый объём работы. Разработать новый игровой режим (антагониста), это огромный объём работы. Если вы не уверены в объёме - то ставите средний в этом случае, или в случае, когда он уместен.
      options:
        - Малый
        - Средний
        - Большой
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Самоконтроль
      description:
      options:
        - label: Идея среднего или большого объёма или я не уверен, что могу принять ответственность за одобрение данной идеи.
        - label: Я приложил ссылку на трекер первоисточник и достаточно подробно описал идею, на GitHub
          required: true
    validations:
      required: true
  - type: textarea
    attributes:
      label: Полное описание самой идеи
      placeholder: Например:, "На большинстве UI окон должна присутствовать кнопка закрепления UI окна (Либо альтнрнативное размещение кнопки/функционал взаимодействия с интерфейсом для закрепления). Её цель, это не дать окну закрыться при прожатии ESC......"
    validations:
      required: true
